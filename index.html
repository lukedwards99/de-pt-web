      <script>
        // GitHub Pages SPA routing (pairs with /public/404.html)
        // This restores the actual route from the ?/ query parameter
        (function () {
          var l = window.location;
          if (l.search && l.search.startsWith('?/')) {
            var route = l.search.slice(2).split('&')[0];
            var query = l.search.slice(2).split('&').slice(1).join('&');
            var restored = route + (query ? '?' + query : '') + l.hash;
            window.history.replaceState(null, '', l.pathname.replace(/\/$/, '') + '/' + restored);
          }
        })();
