      <script>
        // GitHub Pages SPA routing (pairs with /public/404.html)
        ;(function () {
          var l = window.location
          if (l.search && l.search.startsWith('?/')) {
            var restored = l.search.slice(2).split('&').join('?')
            window.history.replaceState(null, '', l.pathname.replace(/\/$/, '') + '/' + restored + l.hash)
          }
        })()
      </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
