<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&E P.T.</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      //
      // This redirects to /<repo>/?/<path> so the SPA can restore the route.
      ;(function (l) {
        // If you're using /<repo>/ as base, pathSegmentsToKeep should be 1.
        // Example: https://user.github.io/de-pt-web/contact
        // Keep "de-pt-web" and move the rest into the query.
        var pathSegmentsToKeep = 1

        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            l.pathname
              .split('/')
              .slice(0, 1 + pathSegmentsToKeep)
              .join('/') +
            '/?/' +
            l.pathname
              .split('/')
              .slice(1 + pathSegmentsToKeep)
              .join('/')
              .replace(/&/g, '~and~') +
            (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
            l.hash
        )
      })(window.location)
    </script>
  </head>
  <body></body>
</html>
