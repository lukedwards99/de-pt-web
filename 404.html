<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="refresh" content="0; url=./" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>D&E P.T.</title>
    <script>
      // GitHub Pages SPA fallback:
      // rewrite /<repo>/some/path -> /<repo>/?/some/path so the SPA router can pick it up.
      var l = window.location;
      var path = l.pathname.replace(/^(.*\/)([^\/]+)$/, '$1$2');
      l.replace(l.origin + path.split('/').slice(0, 3).join('/') + '/?/' + l.pathname.split('/').slice(3).join('/') + l.search + l.hash);
    </script>
  </head>
  <body></body>
</html>
